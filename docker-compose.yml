services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: emrecyhn/assesment:latest
    restart: unless-stopped
    # Not published to the host; reachable only over the internal network
    # (nginx -> app:3000).
    expose:
      - "3000"
    environment:
      # Container-to-container: reach Postgres by service name, not localhost.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      # Sample data on a fresh database; a no-op once it has rows.
      SEED_ON_START: "${SEED_ON_START:-true}"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  postgres_data:
